# ByteTrack untuk FPS pemrosesan rendah (~2-3 FPS di CPU):
# kendaraan berpindah jauh antar frame, jadi matching dibuat lebih longgar
# dan track dipertahankan lebih lama.
tracker_type: bytetrack
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 60
match_thresh: 0.95
fuse_score: True
